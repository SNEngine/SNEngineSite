<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNEngine Games</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
<header class="header">
  <!-- Header will be generated by JavaScript -->
</header>

<section class="hero">
  <!-- Blurred overlay background for entire hero section -->
  <div class="hero-blur-overlay"></div>

  <div class="hero-content">
    <h2 data-i18n="games_title">SNEngine Games</h2>
    <p data-i18n="games_subtitle">Discover amazing visual novel games built with SNEngine</p>
  </div>
</section>

<!-- Games Section -->
<section class="section games-section">
  <div class="container">
    <div id="games-container">
      <!-- Games will be dynamically loaded here -->
    </div>
  </div>
</section>

<footer class="footer">
  <!-- Footer will be generated by JavaScript -->
</footer>

<script src="js/lang-en.js"></script>
<script src="js/lang-ru.js"></script>
<script src="js/language-manager.js"></script>
<script src="js/nav-footer.js"></script>
<script src="js/games.js"></script>
</body>
</html>
