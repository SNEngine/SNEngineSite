<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="terms_title">Terms and License - SNEngine</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <header class="header">
        <!-- Header will be generated by JavaScript -->
    </header>

    <section class="hero">
        <!-- Blurred overlay background for entire hero section -->
        <div class="hero-blur-overlay"></div>

        <div class="hero-content">
            <h2 data-i18n="terms_title">Terms and License</h2>
            <p data-i18n="terms_subtitle">SNENGINE GLOBAL PUBLIC & PROPRIETARY LICENSE</p>
        </div>
    </section>

    <section class="section terms-section">
        <div class="container">
            <div class="terms-content">
                <div id="license-content">
                    <!-- License content will be loaded here -->
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <!-- Footer will be generated by JavaScript -->
    </footer>

    <script src="js/lang-en.js"></script>
    <script src="js/lang-ru.js"></script>
    <script src="js/language-manager.js"></script>
    <script src="js/nav-footer.js"></script>
    <script>
        // Load the appropriate license based on user's language preference
        document.addEventListener('DOMContentLoaded', () => {
            const lang = LanguageManager.currentLang;
            loadLicense(lang);

            // Set up listener for language changes
            window.addEventListener('languageChanged', (event) => {
                loadLicense(event.detail.lang);
            });
        });

        async function loadLicense(lang) {
            try {
                let response;
                if (lang === 'ru') {
                    response = await fetch('licenses/LICENSE_RU');
                } else {
                    response = await fetch('licenses/LICENSE_EN');
                }

                if (response.ok) {
                    const content = await response.text();
                    document.getElementById('license-content').innerHTML = formatLicense(content);
                } else {
                    throw new Error(`Failed to load license: ${response.status}`);
                }
            } catch (error) {
                console.error('Error loading license:', error);
                document.getElementById('license-content').innerHTML = '<p data-i18n="terms_load_error">Error loading license terms. Please try again later.</p>';
            }
        }

        function formatLicense(text) {
            // Split text into lines for processing
            const lines = text.split('\n');
            let html = '';
            let inParagraph = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                if (line.startsWith('### ')) {
                    // Close paragraph if open
                    if (inParagraph) {
                        html += '</p>';
                        inParagraph = false;
                    }
                    // Process heading 3
                    line = line.substring(4).trim();
                    line = processInlineFormatting(line);
                    html += `<h3>${line}</h3>\n`;
                } else if (line.startsWith('## ')) {
                    // Close paragraph if open
                    if (inParagraph) {
                        html += '</p>';
                        inParagraph = false;
                    }
                    // Process heading 2
                    line = line.substring(3).trim();
                    line = processInlineFormatting(line);
                    html += `<h2>${line}</h2>\n`;
                } else if (line.startsWith('# ')) {
                    // Close paragraph if open
                    if (inParagraph) {
                        html += '</p>';
                        inParagraph = false;
                    }
                    // Process heading 1
                    line = line.substring(2).trim();
                    line = processInlineFormatting(line);
                    html += `<h1>${line}</h1>\n`;
                } else if (line.trim() === '') {
                    // Empty line - close paragraph if open
                    if (inParagraph) {
                        html += '</p>\n';
                        inParagraph = false;
                    }
                } else {
                    // Regular paragraph content
                    if (!inParagraph) {
                        html += '<p>';
                        inParagraph = true;
                    }

                    // Process inline formatting and add line
                    line = processInlineFormatting(line.trim());
                    html += line + '<br>';
                }
            }

            // Close final paragraph if needed
            if (inParagraph) {
                html += '</p>';
            }

            return html;
        }

        function processInlineFormatting(text) {
            // Process bold formatting
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Process hyperlinks in markdown format [text](url)
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            // Process plain URLs (more comprehensive pattern)
            text = text.replace(/(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gi, '<a href="$&" target="_blank">$&</a>');
            // Process email addresses
            text = text.replace(/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b/g, '<a href="mailto:$&">$&</a>');
            // Process phone numbers (patterns like +7 901 856 41 27)
            text = text.replace(/\+\d{1,3}[\s-]?\d{3,4}[\s-]?\d{3}[\s-]?\d{2}[\s-]?\d{2}/g, '<a href="tel:$&">$&</a>');
            // Process Telegram usernames (t.me/username)
            text = text.replace(/\b(t\.me\/[A-Za-z0-9_]+)\b/g, '<a href="https://$&" target="_blank">$&</a>');
            return text;
        }
    </script>
</body>
</html>
